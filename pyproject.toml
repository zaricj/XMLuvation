[project]
name = "xmluvation"
version = "1.4.0"
description = "A XML searcher with XPath expressions, with the ability to export matches to a CSV file."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "lxml>=6.0.1",
    "pandas>=2.3.1",
    "pyside6-essentials>=6.10.0",
    "tabulate>=0.9.0",
    "xlsxwriter>=3.2.5",
]

[project.gui-scripts]
xmluvation = "xmluvation.app.bootstrap:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "nuitka>=4.3.4",
    "pandas-stubs",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: large generated inputs, deselect with -m 'not slow'"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/xmluvation/presentation/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
files = ["src/xmluvation/domain", "src/xmluvation/application"]
strict = true
ignore_missing_imports = true
